packages:
  - "packages/*"
  - "workers/*"
  - "apps/*"
  - "cli"

allowBuilds:
  esbuild: set this to true or false
  sharp: set this to true or false
  workerd: set this to true or false

minimumReleaseAgeExclude:
  - '@cloudflare/workers-types@5.20260809.1'

onlyBuiltDependencies:
  - esbuild
  - sharp
  - workerd
